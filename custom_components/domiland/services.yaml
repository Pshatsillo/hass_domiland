submit_metering:
  name: Передать показания счётчика
  description: Отправляет показания в Домиленд для указанного счётчика.
  fields:
    group_id:
      name: ID группы счётчиков
      description: ID группы (meteringGroupId), например 5.
      required: true
      selector:
        number:
          min: 1
    device_id:
      name: ID устройства
      description: ID прибора (meteringDeviceId), например 2214964.
      required: true
      selector:
        number:
          min: 1
    values:
      name: Значения по тарифам
      description: "Словарь: {1: '1750', 2: '800'}. Ключ — номер тарифа."
      required: true
      selector:
        object: